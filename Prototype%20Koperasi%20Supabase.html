<style>

*{box-sizing:border-box}body{margin:0;font:15px/1.4 Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:14px 16px 0}h1{font-size:18px;margin:0}header small{color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:14px}
nav button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
main{padding:0 16px 40px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.hint{color:var(--mu);font-size:13px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{background:var(--bg);border-radius:10px;padding:10px}.k b{display:block;font-size:17px;margin-top:2px}.k span{font-size:12px;color:var(--mu)}
.add{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.add label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);min-width:110px}
.btn{background:var(--pr);color:var(--prt);border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit;font-weight:bold}
.btn.o{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.x{background:var(--erb);border:0;color:var(--er);cursor:pointer;font-size:13px;padding:5px 12px;border-radius:8px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:normal;font-size:12px;position:sticky;top:0;background:var(--card)}
td.r{text-align:right}
.b{padding:2px 9px;border-radius:12px;font-size:12px;font-weight:bold}.g{background:var(--okb);color:var(--ok)}.y{background:var(--wnb);color:var(--wn)}.rd{background:var(--erb);color:var(--er)}
.big{font-size:16px;padding:10px 14px;border-radius:10px;margin:10px 0;font-weight:bold}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--card)}.mu{color:var(--mu)}.row .btn{padding:6px 12px}</style></head><body>

// KONFIGURASI SUPABASE: isi URL projek dan anon/public key dari dashboard Supabase.
const SUPABASE_URL = 'ISI_URL_SUPABASE_DI_SINI';
const SUPABASE_ANON_KEY = 'ISI_ANON_PUBLIC_KEY_DI_SINI';
const cloudReady = () => SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('ISI_URL_') && SUPABASE_ANON_KEY.length > 20 && !SUPABASE_ANON_KEY.includes('ISI_ANON_');
let cloudTimer = null;
function setSyncStatus(message, kind=''){
 const el=document.getElementById('syncStatus');
 if(!el)return;
 el.textContent=message;
 el.style.color=kind==='ok'?'var(--ok)':kind==='err'?'var(--er)':'var(--mu)';
}
function cloudHeaders(extra={}){
 return {'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,...extra};
}
async function syncToCloud(){
 if(!cloudReady())return;
 setSyncStatus('Menyimpan perubahan ke database...');
 try{
  const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/kdmp_state?on_conflict=id',{
   method:'POST',
   headers:cloudHeaders({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}),
   body:JSON.stringify({id:1,data:S,updated_at:new Date().toISOString()})
  });
  if(!r.ok)throw new Error(await r.text());
  setSyncStatus('Tersimpan di database online ✓','ok');
 }catch(e){
  console.error('Supabase save error:',e);
  setSyncStatus('Gagal menyimpan online. Periksa pengaturan Supabase.','err');
 }
}
async function initStorage(){
 if(!cloudReady()){
  setSyncStatus('Belum terhubung ke Supabase — data hanya tersimpan di browser ini.','err');
  render();
  return;
 }
 setSyncStatus('Menghubungkan ke database...');
 try{
  const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/kdmp_state?select=data&id=eq.1',{
   headers:cloudHeaders()
  });
  if(!r.ok)throw new Error(await r.text());
  const rows=await r.json();
  if(rows.length && rows[0].data){
   S=rows[0].data;
   try{localStorage.setItem('kdmp1',JSON.stringify(S))}catch(e){}
   setSyncStatus('Terhubung ke database online ✓','ok');
  }else{
   // Jika tabel masih kosong, isi dengan data lokal yang ada atau data contoh.
   await syncToCloud();
  }
 }catch(e){
  console.error('Supabase load error:',e);
  setSyncStatus('Gagal terhubung. Periksa URL, key, dan SQL Supabase.','err');
 }
 render();
}

function calc(){
 const P=S.set,bar={};S.brg.forEach(b=>bar[b.n]=b);
 const amb=S.amb.map(a=>{const b=bar[a.b]||{};return{...a,u:b.u||'',h:b.j||0,tot:a.q*(b.j||0),hpp:a.q*(b.m||0)}});
 const M=S.ang.map(a=>{const k=nm(a),sp=S.sim.filter(x=>x.n===k);
  const pk=sum(sp.filter(x=>x.j==='Pokok'),x=>x.v),bl=sum(sp.filter(x=>x.j==='Bulanan'),x=>x.v);
  const d=new Date(a.t),t=new Date(),bln=Math.max(0,(t.getFullYear()-d.getFullYear())*12+t.getMonth()-d.getMonth()+1);
  const kP=Math.max(0,P.pokok-pk),kB=Math.max(0,bln*P.bulanan-bl),tot=pk+bl,batas=P.dasar==='Total'?tot:bl;
  const ab=sum(amb.filter(x=>x.n===k),x=>x.tot),by=sum(S.bay.filter(x=>x.n===k),x=>x.v),sisa=ab-by,jt=Math.max(0,batas-sisa);
  return{...a,k,pk,bl,kP,kB,tot,kur:kP+kB,batas,ab,by,sisa,jt,st:sisa>batas?'MELEBIHI BATAS':jt<=0?'JATAH HABIS':'BOLEH AMBIL'}});
 const B=S.brg.map(b=>{const o=sum(amb.filter(x=>x.b===b.n),x=>x.q),s=b.s0+b.s1-o;
  return{...b,o,s,nilai:s*b.m,pinj:sum(amb.filter(x=>x.b===b.n),x=>x.tot),unt:sum(amb.filter(x=>x.b===b.n),x=>x.tot-x.hpp),st:s<0?'STOK KURANG':s===0?'HABIS':s<=b.min?'MENIPIS':'AMAN'}});
 return{M,B,amb,mm:Object.fromEntries(M.map(m=>[m.k,m])),bb:Object.fromEntries(B.map(b=>[b.n,b]))};
}
